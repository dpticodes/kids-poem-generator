<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Kids poem generator</title>
  </head>
  <body>
    <header>
      <h1>Welcome to the AI kids poem generator</h1>
    </header>
    <main>
      <form>
        <input
          type="text"
          placeholder="Desribe what your poem is about....."
          autofocus
          required
          autocomplete="off"
        />
        <input type="submit" value="Genrate poem" />
        <div class="hint">i.e: flower, love, rainbow.</div>
        <div>
          Twinkle, twinkle, little star,
          <br />How I wonder what you are,
        </div>
      </form>
    </main>
    <footer>
      This AI project was coded by
      <a href="https://github.com/dpticodes" target="_blank">Deepti Ayyar</a>
      and is open-sourced on
      <a href="https://github.com/dpticodes/kids-poem-generator" target="_blank"
        >GitHub</a
      >
      and is hosted on
      <a href="https://kids-poem-generator.vercel.app/" target="_blank"
        >Vercel</a
      >.
    </footer>
    <script src="index.js"></script>
  </body>
</html>
